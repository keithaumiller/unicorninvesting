# Contextual action links for unicornmetrics
# These provide quick actions on relevant pages

unicornmetrics.refresh_portfolio:
  route_name: unicornmetrics.lean_portfolio
  title: 'Refresh Portfolio Data'
  appears_on:
    - unicornmetrics.dashboard
    - unicornmetrics.lean_portfolio
    - unicornmetrics.lean_holdings
  options:
    attributes:
      class: ['button', 'button--primary', 'refresh-action']

unicornmetrics.run_backtest:
  route_name: unicornmetrics.lean_backtest_results
  title: 'Run New Backtest'
  appears_on:
    - unicornmetrics.lean_algorithms
    - unicornmetrics.lean_backtest_results
  options:
    attributes:
      class: ['button', 'button--primary', 'backtest-action']

unicornmetrics.algorithm_analysis:
  route_name: unicornmetrics.lean_algorithm_performance
  title: 'Analyze Models'
  appears_on:
    - unicornmetrics.lean_algorithms
  options:
    attributes:
      class: ['button', 'button--secondary', 'analysis-action']

unicornmetrics.run_simulation:
  route_name: unicornmetrics.lean_simulations
  title: 'Run New Simulation'
  appears_on:
    - unicornmetrics.lean_simulations
  options:
    attributes:
      class: ['button', 'button--primary', 'simulation-action']

unicornmetrics.compare_simulations:
  route_name: unicornmetrics.lean_simulations
  title: 'Compare Simulations'
  appears_on:
    - unicornmetrics.lean_simulations
    - unicornmetrics.lean_simulation_performance
  options:
    attributes:
      class: ['button', 'button--secondary', 'compare-action']

unicornmetrics.export_simulation:
  route_name: unicornmetrics.lean_simulations
  title: 'Export Results'
  appears_on:
    - unicornmetrics.lean_simulation_holdings
    - unicornmetrics.lean_simulation_performance
    - unicornmetrics.lean_simulation_backtest
  options:
    attributes:
      class: ['button', 'button--secondary', 'export-action']
