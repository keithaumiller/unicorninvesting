unicornmetrics.dashboard:
  path: '/admin/metrics'
  defaults:
    _controller: '\Drupal\unicornmetrics\Controller\DashboardController::dashboard'
    _title: 'LEAN Metrics Dashboard'
  requirements:
    _access: 'TRUE'

# LEAN Portfolio Management Routes
unicornmetrics.lean_portfolio:
  path: '/admin/metrics/lean/portfolio'
  defaults:
    _controller: '\Drupal\unicornmetrics\Controller\DashboardController::leanPortfolio'
    _title: 'LEAN Portfolio Management'
  requirements:
    _access: 'TRUE'

unicornmetrics.lean_holdings:
  path: '/admin/metrics/lean/holdings'
  defaults:
    _controller: '\Drupal\unicornmetrics\Controller\DashboardController::leanHoldings'
    _title: 'LEAN Portfolio Holdings'
  requirements:
    _access: 'TRUE'

unicornmetrics.lean_performance:
  path: '/admin/metrics/lean/performance'
  defaults:
    _controller: '\Drupal\unicornmetrics\Controller\DashboardController::leanPerformance'
    _title: 'LEAN Portfolio Performance'
  requirements:
    _access: 'TRUE'

# LEAN Algorithm Management Routes
unicornmetrics.lean_algorithms:
  path: '/admin/metrics/lean/algorithms'
  defaults:
    _controller: '\Drupal\unicornmetrics\Controller\DashboardController::leanAlgorithms'
    _title: 'LEAN Algorithm Management'
  requirements:
    _access: 'TRUE'

unicornmetrics.lean_algorithm_performance:
  path: '/admin/metrics/lean/algorithms/performance'
  defaults:
    _controller: '\Drupal\unicornmetrics\Controller\DashboardController::leanAlgorithmPerformance'
    _title: 'LEAN Algorithm Performance'
  requirements:
    _access: 'TRUE'

unicornmetrics.lean_backtest_results:
  path: '/admin/metrics/lean/backtest'
  defaults:
    _controller: '\Drupal\unicornmetrics\Controller\DashboardController::leanBacktestResults'
    _title: 'LEAN Backtest Results'
  requirements:
    _access: 'TRUE'
