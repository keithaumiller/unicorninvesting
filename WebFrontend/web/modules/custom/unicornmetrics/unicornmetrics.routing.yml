# Administration Routes
unicornmetrics.admin.settings:
  path: '/admin/config/unicornmetrics/settings'
  defaults:
    _form: '\Drupal\unicornmetrics\Form\AdminSettingsForm'
    _title: 'UnicornMetrics Settings'
  requirements:
    _permission: 'administer unicorn metrics'
  options:
    no_cache: TRUE
