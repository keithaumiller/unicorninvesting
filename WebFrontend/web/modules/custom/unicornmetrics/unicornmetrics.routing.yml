unicornmetrics.dashboard:
  path: '/admin/metrics'
  defaults:
    _controller: '\Drupal\unicornmetrics\Controller\DashboardController::dashboard'
    _title: 'LEAN Metrics Dashboard'
  requirements:
    _permission: 'administer site configuration'

unicornmetrics.portfolio:
  path: '/admin/metrics/portfolio'
  defaults:
    _controller: '\Drupal\unicornmetrics\Controller\DashboardController::portfolio'
    _title: 'Portfolio Statistics'
  requirements:
    _permission: 'administer site configuration'

unicornmetrics.trades:
  path: '/admin/metrics/trades'
  defaults:
    _controller: '\Drupal\unicornmetrics\Controller\DashboardController::trades'
    _title: 'Trade Statistics'
  requirements:
    _permission: 'administer site configuration'

unicornmetrics.risk:
  path: '/admin/metrics/risk'
  defaults:
    _controller: '\Drupal\unicornmetrics\Controller\DashboardController::risk'
    _title: 'Risk Metrics'
  requirements:
    _permission: 'administer site configuration'

unicornmetrics.forecasting:
  path: '/admin/metrics/forecasting'
  defaults:
    _controller: '\Drupal\unicornmetrics\Controller\DashboardController::forecasting'
    _title: 'Forecasting Metrics'
  requirements:
    _permission: 'administer site configuration'

unicornmetrics.market:
