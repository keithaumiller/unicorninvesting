unicornmetrics.dashboard:
  path: '/admin/metrics'
  defaults:
    _controller: '\Drupal\unicornmetrics\Controller\DashboardController::dashboard'
    _title: 'LEAN Metrics Dashboard'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE

# Public Dashboard for Homepage
unicornmetrics.public_dashboard:
  path: '/unicorn'
  defaults:
    _controller: '\Drupal\unicornmetrics\Controller\DashboardController::publicDashboard'
    _title: 'Unicorn Investing Platform'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE

# Public Simulation Details Page
unicornmetrics.simulation_details:
  path: '/unicorn/simulation/{simulation_id}'
  defaults:
    _controller: '\Drupal\unicornmetrics\Controller\DashboardController::simulationDetails'
    _title: 'Simulation Details'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE

# LEAN Portfolio Management Routes
unicornmetrics.lean_portfolio:
  path: '/admin/metrics/lean/portfolio'
  defaults:
    _controller: '\Drupal\unicornmetrics\Controller\DashboardController::leanPortfolio'
    _title: 'LEAN Portfolio Management'
  requirements:
    _permission: 'access unicorn metrics'
  options:
    no_cache: TRUE

unicornmetrics.lean_holdings:
  path: '/admin/metrics/lean/holdings'
  defaults:
    _controller: '\Drupal\unicornmetrics\Controller\DashboardController::leanHoldings'
    _title: 'LEAN Portfolio Holdings'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE

unicornmetrics.lean_performance:
  path: '/admin/metrics/lean/performance'
  defaults:
    _controller: '\Drupal\unicornmetrics\Controller\DashboardController::leanPerformance'
    _title: 'LEAN Portfolio Performance'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE

